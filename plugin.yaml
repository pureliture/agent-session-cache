name: context-hide
version: 0.1.0
manifest_version: 1
description: Request-side tool-result summarization for Hermes sessions. Replaces large already-transmitted tool results with short summaries on the outgoing request copy only; the model restores originals through unhide_context.
author: Context Hide Contributors
license: MIT
homepage: https://github.com/pureliture/agent-session-cache
kind: standalone
# The engine and the Hermes adapter are vendored under vendor/ and are
# loaded by the plugin root at import time (see __init__.py). Nothing is
# installed into Hermes' shared environment, so the plugin declares its own
# Python runtime instead of joining the uv workspace as a buildable member.
# That also keeps two profiles from declaring the same distribution name.
python_runtime: external
provides_tools:
  - hide_context
  - list_context_items
  - unhide_context

config_schema:
  enabled:
    type: bool
    default: false
    description: Enable hiding and request rewriting. Keep false until a verified session turns it on.
  summary_mode:
    type: str
    default: rules
    choices: [rules, llm]
    description: Use conservative rules by default, or an explicitly configured local model.
  base_url:
    type: str
    default: ""
    description: Loopback-only OpenAI-compatible API base URL, usually ending in /v1. No default endpoint is selected.
  model:
    type: str
    default: ""
    description: Exact model ID sent to the configured local endpoint; required when summary_mode is llm.
  timeout_seconds:
    type: int
    default: 60
    description: Maximum time allowed for one local summarization request.
  max_input_bytes:
    type: int
    default: 12288
    description: Maximum UTF-8 bytes sent to the local summarizer.
  max_output_tokens:
    type: int
    default: 384
    description: Maximum generated tokens requested from the local summarizer.
